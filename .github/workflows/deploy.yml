name: Deploy to cPanel (globalapex.net)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SCP to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "*.html,*.php,*.xml,*.txt,assets/,sitemap.xml,robots.txt,llms.txt,.htaccess"
          target: ${{ secrets.REMOTE_TARGET }}
          strip_components: 0
          overwrite: true

      - name: Notify on success
        if: success()
        run: echo "Deployment to globalapex.net completed successfully!"

      - name: Notify on failure
        if: failure()
        run: echo "Deployment failed. Check SSH secrets and server connectivity."
