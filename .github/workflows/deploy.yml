name: Deploy to cPanel (globalapex.net)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy files via rsync over SSH
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc --delete --exclude='.git' --exclude='.github' --exclude='node_modules'"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.REMOTE_TARGET }}
          EXCLUDE: ".git/, .github/, node_modules/, .env"

      - name: Notify on success
        if: success()
        run: echo "✅ Deployment to globalapex.net completed successfully!"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed. Check SSH secrets and server connectivity."
